name: Deploy diagram site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pages 未开启时不再让整个流水线失败（否则每次 push 都会收到失败邮件）。
      # 开启方式：Settings → Pages → Source 选 "GitHub Actions"。
      - id: gate
        name: Check whether Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages 已开启，继续部署。"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages 尚未开启::到 Settings → Pages 把 Source 设为 GitHub Actions，之后本工作流会自动部署到 GitHub Pages。"
          fi

      - name: Setup Pages
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
